name: poc-merge
on:
  push:
    branches: [merge-test]
permissions:
  contents: write
  pull-requests: write
jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - name: approve then merge PR 1
        run: |
          echo "--- whoami"
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/user" -w '\nHTTP:%{http_code}\n'
          echo "--- submit approving review"
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1/reviews" \
            -d '{"event":"APPROVE","body":"lgtm"}' -w '\nHTTP:%{http_code}\n'
          echo "--- merge PR 1"
          curl -sS -X PUT -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/1/merge" \
            -d '{"merge_method":"squash"}' -w '\nHTTP:%{http_code}\n'
        env:
          TOKEN: ${{ github.token }}
