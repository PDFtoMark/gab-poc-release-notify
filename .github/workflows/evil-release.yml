# Stands in for the real "Release" workflow. Note the file path is different
# from .github/workflows/release.yml: the workflow_run filter matches on the
# workflow NAME, not the file path.
name: Release

on:
  push:
    branches:
      - attacker
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Build notification manifest
        run: |
          mkdir -p .release-notification
          cat > .release-notification/notification.json <<'JSON'
          {"type":"release","publishedPackages":[{"name":"poc-pkg","version":"1.0.0"}],"pullRequestNumber":1}
          JSON
      - name: Upload release notification manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notification
          path: .release-notification
          include-hidden-files: true
